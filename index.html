<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gallery Hunt | High Museum of Art</title>
<meta name="description" content="A scavenger hunt through the galleries of the High Museum of Art.">
<link rel="stylesheet" href="assets/high.css">
<style>
  /* ---------- Answer grid ---------- */
  .grid-wrap { padding: 6px 0 4px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .agrid { display: grid; gap: 5px; justify-content: start; width: max-content; margin: 0 auto; }
  .arow { display: grid; gap: 5px; grid-auto-flow: column; justify-content: start; }

  .sq {
    width: var(--sq, 34px); height: var(--sq, 34px);
    border: 1px solid var(--hm-rule);
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--hm-sans); font-weight: 700;
    font-size: calc(var(--sq, 34px) * .5);
    color: var(--hm-black); text-transform: uppercase;
    border-radius: 3px;
  }
  .sq.is-blank { border-color: transparent; background: transparent; }
  .sq.is-pending { background: var(--hm-wash); border-style: dashed; }
  .sq.is-clue { border-color: transparent; color: var(--hm-black); }

  /* Letters drop in one at a time when a row is solved. */
  .sq.is-pop  { animation: pop .34s cubic-bezier(.2,1.3,.4,1) both; }
  .sq.is-drop { animation: drop .42s cubic-bezier(.16,1.1,.3,1) both; }
  .sq.is-settle { animation: settle .5s ease both; }
  @keyframes pop { 0% { transform: scale(.55); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes drop {
    0%   { transform: translateY(-26px) scale(.75) rotate(-6deg); opacity: 0; }
    60%  { transform: translateY(3px) scale(1.06) rotate(1deg); opacity: 1; }
    100% { transform: translateY(0) scale(1) rotate(0); opacity: 1; }
  }
  @keyframes settle {
    0%   { border-color: var(--hm-black); background: #fff; }
    35%  { border-color: var(--hm-black); background: #f3f3f3; transform: translateY(-3px); }
    100% { border-color: var(--hm-rule); background: #fff; transform: translateY(0); }
  }

  /* Finale: rows slide, everything but the clue column fades back. */
  .arow.is-shifting { transition: transform 1.05s cubic-bezier(.22,.68,.24,1); }
  .sq.is-dim { opacity: .3; transition: opacity .55s ease; }
  .sq.is-reveal { animation: revealSq .62s cubic-bezier(.2,1.25,.35,1) both; }
  @keyframes revealSq {
    0%   { transform: scale(1); box-shadow: 0 0 0 0 rgba(0,0,0,0); }
    45%  { transform: scale(1.32); box-shadow: 0 6px 20px rgba(0,0,0,.22); }
    100% { transform: scale(1); box-shadow: 0 2px 8px rgba(0,0,0,.14); }
  }
  .sq.is-clue { border-color: transparent; font-weight: 700; }

  /* No scrolling or tapping while the finale plays. */
  body.is-locked { overflow: hidden; touch-action: none; }
  body.is-locked .pieces, body.is-locked .hm-header { pointer-events: none; }

  @media (prefers-reduced-motion: reduce) {
    .sq.is-drop, .sq.is-settle, .sq.is-reveal, .sq.is-pop { animation-duration: .01ms; }
    .arow.is-shifting { transition-duration: .01ms; }
  }

  /* ---------- Pieces ---------- */
  .pieces { display: grid; grid-template-columns: 1fr; gap: 18px; max-width: 560px; margin: 0 auto; }

  .piece {
    position: relative; display: block; width: 100%;
    border: 1px solid var(--hm-rule); background: var(--hm-wash-2);
    padding: 0; cursor: pointer; overflow: hidden;
    transition: border-color .15s ease;
  }
  .piece:hover { border-color: var(--hm-black); }
  .piece img { display: block; width: 100%; height: auto; }
  .piece-num {
    position: absolute; top: 0; left: 0;
    background: var(--hm-black); color: #fff;
    font-family: var(--hm-sans); font-size: 11px; font-weight: 700;
    letter-spacing: .1em; padding: 6px 10px; z-index: 2;
  }
  .piece.is-solved { border-color: var(--hm-black); }
  .piece.is-solved img { opacity: .45; }
  .piece-solved-tag {
    position: absolute; inset: auto 0 0 0;
    background: var(--hm-black); color: #fff;
    font-family: var(--hm-sans); font-size: 11px; font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase; padding: 8px 10px;
    display: none;
  }
  .piece.is-solved .piece-solved-tag { display: block; }

  /* ---------- Modal ---------- */
  .modal {
    position: fixed; inset: 0; z-index: 60;
    background: rgba(20,20,20,.92);
    display: none; flex-direction: column;
    opacity: 0; transition: opacity .2s ease;
  }
  .modal.is-open { display: flex; opacity: 1; }
  .modal.is-closing { opacity: 0; }

  .modal-close {
    position: absolute; top: max(12px, env(safe-area-inset-top)); right: 12px; z-index: 3;
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.35); background: rgba(0,0,0,.35);
    color: #fff; font-size: 20px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(3px);
  }
  .modal-close:hover { background: rgba(0,0,0,.6); border-color: #fff; }

  .modal-stage {
    flex: 1; min-height: 0; overflow: auto; position: relative;
    display: flex; align-items: center; justify-content: center;
    padding: 8px;
    /* Click-to-zoom is deliberately absent; pinch and pan still work here so
       players can inspect brushwork up close. */
    touch-action: pinch-zoom pan-x pan-y;
  }
  .modal-stage img {
    max-width: 100%; max-height: 100%; object-fit: contain;
    user-select: none; -webkit-user-drag: none;
  }

  .modal-foot {
    flex: none; background: #fff;
    padding: 16px var(--hm-edge) max(16px, env(safe-area-inset-bottom));
    border-top: 1px solid var(--hm-rule);
  }
  .modal-foot form { max-width: 560px; margin: 0 auto; }
  .hint-row {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin: -4px 0 9px; min-height: 24px;
  }
  .letter-count {
    font-family: var(--hm-sans); font-size: 12px; letter-spacing: .08em;
    text-transform: uppercase; color: #6f6f6f;
  }
  .hint-btn {
    font-family: var(--hm-sans); font-size: 11px; font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase;
    border: 1px solid var(--hm-rule); background: #fff; color: var(--hm-ink);
    padding: 4px 10px; cursor: pointer; border-radius: 0;
  }
  .hint-btn:hover { border-color: var(--hm-black); color: var(--hm-black); }
  .hint-text {
    font-family: var(--hm-sans); font-size: 12.5px; color: var(--hm-ink);
    animation: hintIn .3s ease both;
  }
  @keyframes hintIn { from { opacity: 0; transform: translateX(-4px); } to { opacity: 1; transform: none; } }
  .answer-row { display: flex; gap: 10px; align-items: stretch; }
  .answer-row .hm-input { flex: 1; min-width: 0; }
  @media (max-width: 420px) { .answer-row { flex-direction: column; } }

  .hm-input.is-wrong { border-color: var(--hm-red); background: #fff5f4; animation: shake .45s ease; }
  .hm-input.is-right { border-color: #1a7f37; background: #f0fbf2; }
  @keyframes shake {
    10%,90% { transform: translateX(-2px); } 20%,80% { transform: translateX(4px); }
    30%,50%,70% { transform: translateX(-7px); } 40%,60% { transform: translateX(7px); }
  }
  .answer-msg { font-size: 12.5px; margin: 8px 0 0; min-height: 17px; }
  .answer-msg.is-wrong { color: var(--hm-red); }
  .answer-msg.is-right { color: #1a7f37; }

  .msg-state { padding: 54px 0 80px; max-width: 62ch; }
  .msg-state h1 { font-family: var(--hm-serif); font-weight: 300; font-size: 38px; color: var(--hm-black); margin: 0 0 14px; }

  .hunt-list { list-style: none; padding: 0; margin: 22px 0 0; }
  .hunt-list li { border-bottom: 1px solid var(--hm-rule); }
  .hunt-list a { display: block; padding: 15px 0; font-family: var(--hm-serif); font-size: 21px; color: var(--hm-black); }
  .hunt-list a:hover { color: var(--hm-red); text-decoration: none; }
  .hunt-list .meta { display: block; font-family: var(--hm-sans); font-size: 12.5px; color: #6f6f6f; letter-spacing: .04em; }
</style>
</head>
<body>

<header class="hm-header">
  <div class="hm-shell hm-header-inner">
    <a class="hm-wordmark" href="./">High Museum of Art</a>
    <div class="hm-header-meta" id="headerMeta">Gallery Hunt</div>
  </div>
</header>

<main class="hm-shell" id="main">
  <div id="stateMsg" class="msg-state" hidden></div>

  <div id="puzzleWrap" hidden>
    <div class="hm-titleblock">
      <p class="hm-eyebrow" id="puzzleEyebrow">Scavenger Hunt</p>
      <h1 class="hm-title" id="puzzleTitle">Puzzle</h1>
      <p class="hm-standfirst" id="puzzleIntro"></p>
    </div>

    <div class="grid-wrap"><div class="agrid" id="agrid"></div></div>

    <hr class="hm-rule" style="margin:30px 0 26px">

    <h2 class="hm-h2" style="text-align:center;margin-bottom:6px">The Works</h2>
    <p style="text-align:center;font-size:13.5px;color:#6f6f6f;margin:0 0 22px">
      Tap a piece to look closer and enter your answer.
    </p>
    <div class="pieces" id="pieces"></div>
  </div>
</main>

<footer class="hm-footer">
  <div class="hm-shell"><span id="footerSlug"></span></div>
</footer>

<!-- Answer modal -->
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalPrompt">
  <button class="modal-close" id="modalClose" type="button" aria-label="Close">&times;</button>
  <div class="modal-stage" id="modalStage">
    <img id="modalImg" alt="Artwork" draggable="false">
  </div>
  <div class="modal-foot">
    <form id="answerForm" autocomplete="off">
      <label class="hm-label" id="modalPrompt" for="answerInput">Name of Work</label>
      <div class="hint-row">
        <span class="letter-count" id="letterCount"></span>
        <button type="button" class="hint-btn" id="hintBtn" hidden>Hint</button>
        <span class="hint-text" id="hintText" hidden></span>
      </div>
      <div class="answer-row">
        <input class="hm-input" id="answerInput" type="text" autocomplete="off"
               autocorrect="off" autocapitalize="words" spellcheck="false" enterkeyhint="send">
        <button class="hm-btn hm-btn--red" id="submitBtn" type="submit">Submit</button>
      </div>
      <p class="answer-msg" id="answerMsg" aria-live="polite"></p>
    </form>
  </div>
</div>

<script src="assets/acrostic.js"></script>
<script src="assets/player.js"></script>
</body>
</html>
